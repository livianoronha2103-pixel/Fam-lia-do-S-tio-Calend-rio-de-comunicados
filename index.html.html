document.addEventListener('click',e=>{const t=e.target,c=t.closest('.cd,tr.r'),b=t.closest('button');
 if(b&&b.dataset.v){U.v=b.dataset.v;return render()}if(b&&b.dataset.m){U.cur=b.dataset.y+'-'+pad(b.dataset.m)+'-01';if(U.v==='list'||U.v==='pend')U.v='month';return render()}
 if(b&&b.dataset.pl){const p=S.pend.find(x=>x.id===b.dataset.pl);return openForm({...blank(p.d||'',p.h||''),t:p.t,fx:p.fx||'',e:p.e||'',obs:p.nota,pid:p.id},'new')}
 if(b&&b.dataset.pd){return mut(()=>{S.pend=S.pend.filter(x=>x.id!==b.dataset.pd)},'Pendência descartada')}
 if(b&&b.classList.contains('more'))return openDay(b.dataset.d);
 if(c&&c.dataset.id&&c.closest('main,#dd')){if(c.closest('#dd'))$('#dd').close();return openEdit(c.dataset.id,c.dataset.od)}
 const cell=t.closest('.c');if(cell)return openForm(blank(cell.dataset.d,cell.dataset.h),'new');const md=t.closest('.md');if(md)openDay(md.dataset.d)});
document.addEventListener('change',e=>{if(e.target.id==='ys'){U.cur=e.target.value+U.cur.slice(4);render()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('cd'))e.target.click()});
addEventListener('resize',()=>{if(U.v==='week')render()});
render();
</script></body></html>
